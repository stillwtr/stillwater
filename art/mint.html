<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Mint</title>
  <style>
    :root {
      --floor: #1C242B;
      --lip: #10161B;
      --ink: #D5DDE4;
      --dim: #8E9BA6;
      --quiet: #74808C;
      --plate: #E4E7EC;
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--floor);
      color: var(--ink);
      font-family: "Liberation Sans", "Nimbus Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .name {
      margin: 0;
      padding: 0.85rem 1rem 0.15rem;
      text-align: center;
    }
    .name a {
      color: var(--ink);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-decoration: none;
      cursor: pointer;
    }
    .lintel, .note {
      min-height: 1em;
      margin: 0;
      text-align: center;
    }
    .lintel { padding: 0.05rem 1rem 0.45rem; }
    .whisper {
      margin: 0.35rem 0 0;
      min-height: 1em;
      text-align: center;
      color: var(--dim);
      font-weight: 500;
    }
    .whisper button {
      padding: 0.45rem 0.28rem;
      color: var(--dim);
      font-weight: 500;
      transition: opacity 280ms linear;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .whisper button.fade { opacity: 0; }
    .court {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: var(--floor);
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }
    .nine {
      display: grid;
      grid-template-columns: repeat(3, max-content);
      gap: 0.55rem;
      justify-content: center;
      align-content: center;
    }
    .pool {
      line-height: 0;
      background: var(--lip);
      padding: 3px;
    }
    canvas {
      display: block;
      background: var(--plate);
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .threshold {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 0.25rem;
    }
    .words { display: flex; gap: 1.8rem; justify-content: center; }
    button {
      font: inherit;
      color: var(--dim);
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      letter-spacing: 0.24em;
      font-weight: 500;
      box-shadow: none;
    }
    button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
    #lintel {
      color: var(--quiet);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      transition: opacity 180ms linear;
    }
    #lintel.copied { opacity: 0.45; }
    .note { padding: 0.35rem 1rem 0.85rem; color: var(--dim); }
  </style>
</head>
<body>
  <p class="name"><a href="walk.html">stillwater</a></p>
  <div class="court">
    <div class="nine" id="grid"></div>
    <div class="pool" id="pool-wrap" hidden>
      <canvas id="pool" width="128" height="128"></canvas>
    </div>
  </div>
  <p class="whisper" id="figure">
    <button type="button" id="price" data-name="mint price" data-value="0.00420 eth">0.00420 eth</button>
    <span aria-hidden="true"> · </span>
    <button type="button" id="left" data-name="remaining" data-value="512">512</button>
  </p>
  <div class="lintel" id="lintel-wrap" hidden>
    <button type="button" id="lintel" aria-live="polite"></button>
  </div>
  <div class="threshold">
    <div class="words">
      <button type="button" id="connect" aria-pressed="false">connect</button>
      <button type="button" id="mint" aria-pressed="false">mint</button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <script src="keccak256.js"></script>
  <script src="palettes.js"></script>
  <script src="render.js"></script>
  <script src="mint.js"></script>
</body>
</html>
