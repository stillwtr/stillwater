<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Mint</title>
  <style>
    :root {
      --floor: #1C242B;
      --lip: #10161B;
      --ink: #D5DDE4;
      --dim: #8E9BA6;
      --plate: #E4E7EC;
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--floor);
      color: var(--ink);
      font-family: "Liberation Sans", "Nimbus Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .lintel, .note {
      min-height: 1em;
      margin: 0;
      text-align: center;
    }
    .lintel { padding: 0.85rem 1rem 0.55rem; }
    .whisper, .left {
      margin: 0;
      min-height: 1em;
      text-align: center;
      color: var(--dim);
      font-weight: 500;
    }
    .left { margin: 0.15rem 0 0.45rem; }
    .court {
      flex: 1;
      width: 100%;
      background: var(--floor);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pool {
      line-height: 0;
      background: var(--lip);
      padding: 3px;
    }
    canvas {
      display: block;
      background: var(--plate);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .threshold {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 0.25rem;
    }
    .words { display: flex; gap: 1.8rem; justify-content: center; }
    button {
      font: inherit;
      color: var(--dim);
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      letter-spacing: 0.24em;
      font-weight: 500;
      box-shadow: none;
    }
    button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
    #lintel { color: var(--ink); font-weight: 500; transition: color 180ms linear; }
    #lintel.copied { color: var(--dim); }
    .note { padding: 0.35rem 1rem 0.85rem; color: var(--dim); }
  </style>
</head>
<body>
  <div class="lintel">
    <button type="button" id="lintel" aria-live="polite"></button>
  </div>
  <p class="whisper" id="price">0.00420 eth</p>
  <p class="left" id="left">512</p>
  <div class="court">
    <div class="pool" id="pool-wrap" hidden>
      <canvas id="pool" width="128" height="128"></canvas>
    </div>
  </div>
  <div class="threshold">
    <div class="words">
      <button type="button" id="connect" aria-pressed="false">connect</button>
      <button type="button" id="mint" aria-pressed="false">mint</button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <script src="keccak256.js"></script>
  <script src="palettes.js"></script>
  <script src="render.js"></script>
  <script src="mint.js"></script>
</body>
</html>
