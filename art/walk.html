<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>The Walk</title>
  <style>
    :root {
      --floor: #1C242B;
      --lip: #10161B;
      --ink: #D5DDE4;
      --dim: #8E9BA6;
      --plate: #E4E7EC;
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--floor);
      color: var(--ink);
      font-family: "Liberation Sans", "Nimbus Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .lintel, .note {
      min-height: 1em;
      margin: 0;
      text-align: center;
    }
    .lintel { padding: 0.85rem 1rem 0.55rem; }
    .whisper {
      margin: 0 0 0.45rem;
      min-height: 1em;
      text-align: center;
      color: var(--dim);
      font-weight: 500;
    }
    .court {
      flex: 1;
      width: 100%;
      background: var(--floor);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pool {
      line-height: 0;
      background: var(--lip);
      padding: 3px;
    }
    canvas {
      display: block;
      background: var(--plate);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .threshold {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 0.25rem;
    }
    .words {
      display: flex;
      gap: 1.8rem;
      justify-content: center;
    }
    button, input {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      text-decoration: none;
      box-shadow: none;
    }
    button {
      cursor: pointer;
      letter-spacing: 0.24em;
      color: var(--dim);
      font-weight: 500;
    }
    button[aria-pressed="true"] {
      color: var(--ink);
      font-weight: 700;
    }
    #lintel {
      color: var(--ink);
      font-weight: 500;
      transition: color 180ms linear;
    }
    #lintel.copied { color: var(--dim); }
    .whisper button {
      padding: 0.45rem 0.28rem;
      color: var(--dim);
      font-weight: 500;
      transition: opacity 280ms linear;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .whisper button.fade { opacity: 0; }
    input, input::placeholder {
      text-transform: none;
      letter-spacing: 0.04em;
      text-align: center;
    }
    input {
      width: min(36rem, 92vw);
      outline: none;
    }
    input::placeholder { color: var(--dim); }
    .note { padding: 0.35rem 1rem 0.85rem; color: var(--dim); }
  </style>
</head>
<body>
  <div class="lintel">
    <button type="button" id="lintel" aria-live="polite"></button>
  </div>
  <p class="whisper" id="whisper" hidden>
    <button type="button" id="w-pal" data-name="palette"></button>
    <span aria-hidden="true"> · </span>
    <button type="button" id="w-nonce" data-name="nonce"></button>
    <span aria-hidden="true"> · </span>
    <button type="button" id="w-water" data-name="% water"></button>
  </p>
  <div class="court">
    <div class="pool">
      <canvas id="pool" width="128" height="128"></canvas>
    </div>
  </div>
  <div class="threshold">
    <div class="words">
      <button type="button" id="prev" hidden aria-label="Previous">‹</button>
      <button type="button" id="live" aria-pressed="false">LIVE</button>
      <button type="button" id="dated" aria-pressed="false">DATED</button>
      <button type="button" id="search" aria-pressed="false">SEARCH</button>
      <button type="button" id="next" hidden aria-label="Next">›</button>
    </div>
    <input id="field" hidden autocomplete="off" spellcheck="false" aria-label="SEARCH" placeholder="0xd934CC70B1b06256581527a534285f5bd6A7eDc7">
  </div>
  <p class="note" id="note"></p>
  <script src="keccak256.js"></script>
  <script src="palettes.js"></script>
  <script src="render.js"></script>
  <script src="walk.js"></script>
</body>
</html>
