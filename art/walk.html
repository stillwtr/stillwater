<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>The Walk</title>
  <style>
    :root {
      --floor: #1C242B;
      --lip: #10161B;
      --ink: #D5DDE4;
      --dim: #8E9BA6;
      --quiet: #74808C;
      --plate: #E4E7EC;
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--floor);
      color: var(--ink);
      font-family: "Liberation Sans", "Nimbus Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .name {
      margin: 0;
      padding: 0.85rem 1rem 0;
      text-align: center;
    }
    .name a {
      color: var(--ink);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-decoration: none;
      cursor: pointer;
    }
    .note {
      min-height: 1em;
      margin: 0;
      text-align: center;
    }
    .lintel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      margin: 0;
      min-height: 1em;
      padding: 0.05rem 1rem 0.45rem;
    }
    .beam {
      display: flex;
      justify-content: center;
      min-width: 9rem;
    }
    .whisper {
      margin: 0;
      min-height: 1em;
      padding: 0;
      text-align: center;
      color: var(--dim);
      font-weight: 500;
      white-space: nowrap;
    }
    .court {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: var(--floor);
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }
    .pool {
      line-height: 0;
      background: var(--lip);
      padding: 3px;
    }
    canvas {
      display: block;
      background: var(--plate);
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    .threshold {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 0.8rem 1rem 0.25rem;
    }
    .mode {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .words {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.85rem;
      justify-content: center;
    }
    #connect {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }
    .role {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      align-items: center;
    }
    .role .strut {
      grid-area: 1 / 1;
      visibility: hidden;
    }
    .verbs {
      grid-area: 1 / 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1.8rem;
      justify-content: center;
      max-width: 100%;
    }
    button, input {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      text-decoration: none;
      box-shadow: none;
    }
    button {
      cursor: pointer;
      letter-spacing: 0.24em;
      color: var(--dim);
      font-weight: 500;
    }
    button[aria-pressed="true"] {
      color: var(--ink);
      font-weight: 700;
    }
    #prev, #next {
      color: var(--quiet);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      cursor: pointer;
      padding: 0.4rem 0.45rem;
    }
    #prev[aria-disabled="true"], #next[aria-disabled="true"] {
      cursor: default;
    }
    .whisper button {
      padding: 0.45rem 0.28rem;
      color: var(--dim);
      font-weight: 500;
      transition: opacity 280ms linear;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .whisper button.fade { opacity: 0; }
    .whisper button[aria-pressed="true"] {
      color: var(--ink);
      font-weight: 700;
    }
    .vault:not([hidden]) {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.7rem 0.85rem;
      justify-content: center;
      align-items: center;
      max-width: 100%;
      margin: 0;
      border: 1px solid var(--dim);
      padding: 0.15rem 0.5rem;
    }
    .vault input {
      width: 11rem;
      max-width: 52vw;
      min-width: 0;
    }
    #return-row.vault:not([hidden]) {
      flex-wrap: wrap;
      max-width: 100%;
    }
    #return-to {
      font-family: ui-monospace, "Liberation Mono", monospace;
      font-size: min(0.8rem, calc((100vw - 2.75rem) / 42));
      letter-spacing: 0;
      width: 42ch;
      min-width: 42ch;
      max-width: none;
      flex: 0 0 auto;
    }
    input, input::placeholder {
      text-transform: none;
      letter-spacing: 0.04em;
      text-align: center;
    }
    input {
      width: min(36rem, 92vw);
      outline: none;
    }
    input::placeholder { color: var(--dim); }
    .note {
      padding: 0.35rem 1rem 0.85rem;
      color: var(--dim);
      transition: opacity 280ms linear;
    }
    .note.fade { opacity: 0; }
  </style>
</head>
<body>
  <p class="name"><a href="mint.html">stillwater</a></p>
  <div class="lintel" id="lintel">
    <button type="button" id="prev" aria-label="Previous" aria-disabled="true">‹</button>
    <div class="beam">
    <p class="whisper" id="whisper" hidden>
      <button type="button" id="w-id" data-name="print" hidden></button>
      <span id="w-id-gap" hidden aria-hidden="true"> · </span>
      <button type="button" id="w-pal" data-name="palette"></button>
      <span aria-hidden="true"> · </span>
      <button type="button" id="w-nonce" data-name="nonce"></button>
      <span aria-hidden="true"> · </span>
      <button type="button" id="w-water" data-name="% water"></button>
      <span id="ask" hidden><span aria-hidden="true"> · </span><button type="button" id="w-price" data-name="price"></button></span>
    </p>
    </div>
    <button type="button" id="next" aria-label="Next" aria-disabled="true">›</button>
  </div>
  <div class="court">
    <div class="pool">
      <canvas id="pool" width="128" height="128"></canvas>
    </div>
  </div>
  <div class="threshold">
    <div class="mode" id="mode-bar">
      <div class="words">
        <button type="button" id="live" aria-pressed="true">LIVE</button>
        <button type="button" id="dated" aria-pressed="false">DATED</button>
        <button type="button" id="search" aria-pressed="false">SEARCH</button>
        <button type="button" id="listed" aria-pressed="false">LISTED</button>
        <button type="button" id="held" aria-pressed="false">HELD</button>
      </div>
      <button type="button" id="connect" aria-pressed="false">connect</button>
    </div>
    <div class="role" id="role-row">
      <span class="strut" aria-hidden="true">list</span>
      <div class="verbs">
        <button type="button" id="list" hidden aria-pressed="false">list</button>
        <button type="button" id="park" hidden aria-pressed="false">park</button>
        <button type="button" id="return" hidden aria-pressed="false">return</button>
        <button type="button" id="buy" hidden>buy</button>
      </div>
    </div>
    <input id="field" hidden autocomplete="off" spellcheck="false" aria-label="SEARCH" placeholder="0xd934CC70B1b06256581527a534285f5bd6A7eDc7">
    <p class="vault" id="vault-row" hidden>
      <input id="vault" autocomplete="off" spellcheck="false" aria-label="vault" placeholder="0x">
      <button type="button" id="confirm">confirm</button>
    </p>
    <p class="vault" id="return-row" hidden>
      <input id="return-to" size="42" autocomplete="off" spellcheck="false" aria-label="title" placeholder="0x">
      <button type="button" id="return-confirm">confirm</button>
    </p>
    <p class="vault" id="list-row" hidden>
      <input id="list-price" autocomplete="off" spellcheck="false" aria-label="price" placeholder="0.00420">
      <button type="button" id="list-confirm">confirm</button>
    </p>
  </div>
  <p class="note" id="note"></p>
  <script src="keccak256.js"></script>
  <script src="palettes.js"></script>
  <script src="render.js"></script>
  <script src="freeze.js"></script>
  <script src="fork.js"></script>
  <script src="door.js"></script>
  <script src="walk.js"></script>
</body>
</html>
